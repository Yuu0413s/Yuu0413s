name: Update README cards

on:
  schedule:
    # 毎日 0時（JST）に自動実行
    - cron: '0 15 * * *'
  workflow_dispatch: # 手動実行も可能

env:
  # 2種類のカードで共通の設定
  STATS_OPTIONS: show_icons=true&hide_border=true
  # username は WakaTime のユーザー ID（無料プランでは任意のユーザー名を付けられないため）
  # hide でプログラミング言語以外を隠す
  WAKATIME_OPTIONS: username=b2862a6a-91ea-4af7-b351-b6768b373af2&layout=compact&hide_border=true&hide=markdown,other,json,csv,text,toml,tsconfig

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # README では、見る人の GitHub がダークモードなら dark、ライトモードなら light のカードを出す
      - name: Generate GitHub stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_OPTIONS }}&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_OPTIONS }}&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: ${{ env.WAKATIME_OPTIONS }}&theme=github_dark
          path: profile/wakatime-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: ${{ env.WAKATIME_OPTIONS }}&theme=default
          path: profile/wakatime-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
